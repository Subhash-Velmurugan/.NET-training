<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Button Click</title>
</head>
<body>
    <button id="click">Click here</button>
    <script>
        document.getElementById("click").addEventListener("click", function() {
            alert("Button clicked!");
        });
    </script>
</body>
</html>
